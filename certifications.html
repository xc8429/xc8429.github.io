<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Michael 的資訊站｜專業證照、技術認證與培訓證書">
  <title>證照與培訓｜Michael 的資訊站</title>

  <style>
    :root {
      --bg: #11151c;
      --panel: #1b222d;
      --panel-hover: #222c39;
      --text: #e5eaf2;
      --muted: #9aa8ba;
      --accent: #67d8f5;
      --border: #303c4c;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.8;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1100px, 92%);
      margin: auto;
    }

    /* 導覽列 */
    header {
      background: rgba(17, 21, 28, 0.96);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(12px);
    }

    .navbar {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 19px;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: var(--muted);
      font-size: 14px;
      transition: color 0.2s;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--accent);
    }

    /* 頁面標題 */
    .hero {
      padding: 72px 0 48px;
      background:
        radial-gradient(
          ellipse at top right,
          rgba(53, 133, 169, 0.17),
          transparent 55%
        );
      border-bottom: 1px solid var(--border);
    }

    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      margin: 10px 0;
      font-size: clamp(30px, 5vw, 44px);
      line-height: 1.4;
    }

    .hero p {
      max-width: 650px;
      color: var(--muted);
      margin: 12px 0 0;
    }

    /* 統計區 */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 32px;
    }

    .stat-card {
      padding: 18px;
      border: 1px solid var(--border);
      background: rgba(27, 34, 45, 0.8);
      border-radius: 12px;
    }

    .stat-number {
      color: var(--accent);
      font-size: 27px;
      font-weight: 700;
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
    }

    /* 內容區 */
    main {
      padding: 42px 0 70px;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 23px;
    }

    .section-heading p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 28px;
    }

    .search-input,
    .filter-select {
      min-height: 44px;
      padding: 10px 14px;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .search-input {
      flex: 1;
      min-width: 200px;
    }

    .search-input:focus,
    .filter-select:focus {
      border-color: var(--accent);
    }

    .filter-select option {
      background: var(--panel);
    }

    .certificate-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .certificate-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition:
        transform 0.2s,
        border-color 0.2s;
    }

    .certificate-card:hover {
      transform: translateY(-4px);
      border-color: #52758b;
    }

    /* 證書圖片 */
    .certificate-image {
      width: 100%;
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        linear-gradient(135deg, #252f3e, #171e28);
      border-bottom: 1px solid var(--border);
      cursor: zoom-in;
      position: relative;
    }

    .certificate-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 10px;
    }

    .image-placeholder {
      padding: 20px;
      text-align: center;
      color: var(--muted);
    }

    .image-placeholder .icon {
      display: block;
      font-size: 38px;
      margin-bottom: 8px;
      color: var(--accent);
    }

    .image-placeholder small {
      display: block;
      margin-top: 5px;
      font-size: 12px;
    }

    .card-content {
      padding: 18px;
    }

    .tag {
      display: inline-block;
      padding: 3px 9px;
      margin-bottom: 10px;
      border: 1px solid #31576b;
      border-radius: 20px;
      color: var(--accent);
      font-size: 11px;
    }

    .card-content h3 {
      margin: 0 0 10px;
      font-size: 18px;
      overflow-wrap: anywhere;
    }

    .card-content p {
      margin: 5px 0;
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .card-description {
      min-height: 48px;
    }

    .card-actions {
      display: flex;
      gap: 10px;
      margin-top: 17px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 13px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }

    .btn-primary {
      color: #09151c;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 700;
    }

    .btn:hover {
      opacity: 0.85;
    }

    .empty-state {
      display: none;
      padding: 45px 15px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 12px;
    }

    /* 圖片放大視窗 */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      padding: 24px;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.88);
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      max-width: 1000px;
      max-height: 90vh;
      text-align: center;
    }

    .modal-content img {
      display: block;
      max-width: 100%;
      max-height: 78vh;
      margin: auto;
      object-fit: contain;
    }

    .modal-caption {
      color: white;
      margin-top: 12px;
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 22px;
      border: 0;
      background: transparent;
      color: white;
      font-size: 36px;
      cursor: pointer;
    }

    footer {
      padding: 26px 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 850px) {
      .certificate-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .navbar {
        align-items: flex-start;
        flex-direction: column;
        padding: 15px 0;
      }

      .nav-links {
        gap: 12px;
      }
    }

    @media (max-width: 540px) {
      .certificate-grid {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .hero {
        padding-top: 45px;
      }

      .section-heading {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <!-- 導覽列：沿用原網站連結 -->
  <header>
    <div class="container navbar">
      <a class="logo" href="index.html">Michael 的資訊站</a>

      <nav class="nav-links" aria-label="主要導覽">
        <a href="index.html">首頁</a>
        <a href="index.html#about">關於我</a>
        <a href="skill.html">技術能力</a>
        <a href="index.html#portfolio">作品集</a>
        <a href="certifications.html" class="active">證照與培訓</a>
        <a href="contact.html">聯絡方式</a>
      </nav>
    </div>
  </header>

  <!-- 頁面介紹 -->
  <section class="hero">
    <div class="container">
      <div class="eyebrow">CERTIFICATIONS & TRAINING</div>

      <h1>證照與培訓</h1>

      <p>
        持續累積資訊技術知識與實務能力，
        記錄專業證照、技術認證及教育訓練的學習成果。
      </p>

      <div class="stats">
        <div class="stat-card">
          <div class="stat-number" id="professionalCount">0</div>
          <div class="stat-label">專業證照</div>
        </div>

        <div class="stat-card">
          <div class="stat-number" id="trainingCount">0</div>
          <div class="stat-label">培訓證書</div>
        </div>

        <div class="stat-card">
          <div class="stat-number" id="totalCount">0</div>
          <div class="stat-label">證書總數</div>
        </div>
      </div>
    </div>
  </section>

  <main class="container">
    <div class="section-heading">
      <div>
        <h2>我的學習紀錄</h2>
        <p>點擊證書圖片即可放大預覽。</p>
      </div>
    </div>

    <div class="toolbar">
      <input
        type="search"
        id="searchInput"
        class="search-input"
        placeholder="搜尋證書名稱或發證單位..."
        aria-label="搜尋證書"
      >

      <select
        id="categoryFilter"
        class="filter-select"
        aria-label="證書分類"
      >
        <option value="all">全部分類</option>
        <option value="professional">專業證照</option>
        <option value="training">培訓證書</option>
      </select>
    </div>

    <section
      class="certificate-grid"
      id="certificateGrid"
      aria-label="證書列表"
    ></section>

    <div class="empty-state" id="emptyState">
      找不到符合條件的證書。
    </div>
  </main>

  <!-- 證書圖片放大視窗 -->
  <div
    class="modal"
    id="imageModal"
    role="dialog"
    aria-modal="true"
    aria-label="證書圖片預覽"
    aria-hidden="true"
  >
    <button
      class="modal-close"
      id="modalClose"
      type="button"
      aria-label="關閉預覽"
    >&times;</button>

    <div class="modal-content">
      <img id="modalImage" src="" alt="證書放大圖片">
      <div class="modal-caption" id="modalCaption"></div>
    </div>
  </div>

  <footer>
    <div class="container">
      © <span id="year"></span> Michael 的資訊站
      ｜持續學習，精進技術
    </div>
  </footer>

  <script>
    /*
      證書資料設定區
      category:
        professional = 專業證照
        training     = 培訓證書

      image:
        請填入實際證書圖片路徑。
        例如：images/certificates/example.jpg

      以下兩筆皆為示範資料，並非個人實際取得的資格。
    */

    const certificates = [
      {
        id: 1,
        name: "專業證照範例（請替換）",
        category: "professional",
        issuer: "請填寫發證單位",
        date: "請填寫取得日期",
        description: "請填寫證照名稱及相關專業能力。",
        image: ""
      },
      {
        id: 2,
        name: "培訓課程證書範例（請替換）",
        category: "training",
        issuer: "請填寫培訓機構",
        date: "請填寫結訓日期",
        description: "請填寫課程名稱與學習內容。",
        image: ""
      }
    ];

    const categoryNames = {
      professional: "專業證照",
      training: "培訓證書"
    };

    const grid = document.getElementById("certificateGrid");
    const searchInput = document.getElementById("searchInput");
    const categoryFilter = document.getElementById("categoryFilter");
    const emptyState = document.getElementById("emptyState");

    const modal = document.getElementById("imageModal");
    const modalImage = document.getElementById("modalImage");
    const modalCaption = document.getElementById("modalCaption");
    const modalClose = document.getElementById("modalClose");

    document.getElementById("year").textContent =
      new Date().getFullYear();

    function updateStats() {
      const professional = certificates.filter(
        item => item.category === "professional"
      ).length;

      const training = certificates.filter(
        item => item.category === "training"
      ).length;

      document.getElementById("professionalCount").textContent =
        professional;

      document.getElementById("trainingCount").textContent =
        training;

      document.getElementById("totalCount").textContent =
        certificates.length;
    }

    // 避免將證書文字直接當成 HTML 執行
    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function renderCertificates() {
      const keyword = searchInput.value.trim().toLowerCase();
      const category = categoryFilter.value;

      const filtered = certificates.filter(item => {
        const text = [
          item.name,
          item.issuer,
          item.description
        ].join(" ").toLowerCase();

        const matchesKeyword = text.includes(keyword);
        const matchesCategory =
          category === "all" || item.category === category;

        return matchesKeyword && matchesCategory;
      });

      grid.innerHTML = filtered.map(item => {
        const hasImage = Boolean(item.image.trim());

        const imageHTML = hasImage
          ? `
            <div
              class="certificate-image"
              data-preview="${item.id}"
              role="button"
              tabindex="0"
              aria-label="放大查看${escapeHTML(item.name)}"
            >
              <img
                src="${escapeHTML(item.image)}"
                alt="${escapeHTML(item.name)}"
                loading="lazy"
              >
            </div>
          `
          : `
            <div class="certificate-image">
              <div class="image-placeholder">
                <span class="icon">▤</span>
                尚未上傳證書圖片
                <small>請在資料設定區填入圖片路徑</small>
              </div>
            </div>
          `;

        return `
          <article class="certificate-card">
            ${imageHTML}

            <div class="card-content">
              <span class="tag">
                ${escapeHTML(categoryNames[item.category])}
              </span>

              <h3>${escapeHTML(item.name)}</h3>

              <p>發證／培訓單位：${escapeHTML(item.issuer)}</p>
              <p>取得／結訓日期：${escapeHTML(item.date)}</p>

              <p class="card-description">
                ${escapeHTML(item.description)}
              </p>

              <div class="card-actions">
                ${
                  hasImage
                    ? `<button class="btn btn-primary"
                         data-preview="${item.id}"
                         type="button">查看證書</button>`
                    : `<span class="btn">待補證書圖片</span>`
                }
              </div>
            </div>
          </article>
        `;
      }).join("");

      emptyState.style.display = filtered.length ? "none" : "block";

      // 圖片載入失敗時顯示提示
      grid.querySelectorAll(".certificate-image img").forEach(img => {
        img.addEventListener("error", () => {
          const parent = img.parentElement;
          parent.innerHTML = `
            <div class="image-placeholder">
              <span class="icon">!</span>
              圖片載入失敗
              <small>請確認圖片路徑與檔名</small>
            </div>
          `;
          parent.removeAttribute("data-preview");
          parent.removeAttribute("role");
          parent.removeAttribute("tabindex");
          parent.style.cursor = "default";
        }, { once: true });
      });
    }

    function openPreview(id) {
      const item = certificates.find(
        certificate => certificate.id === Number(id)
      );

      if (!item || !item.image.trim()) return;

      modalImage.src = item.image;
      modalImage.alt = item.name;
      modalCaption.textContent = item.name;

      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
      modalClose.focus();
    }

    function closePreview() {
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      modalImage.src = "";
    }

    // 使用事件委派，讓所有證書卡片都能開啟預覽
    grid.addEventListener("click", event => {
      const target = event.target.closest("[data-preview]");
      if (target) openPreview(target.dataset.preview);
    });

    grid.addEventListener("keydown", event => {
      if (
        event.target.matches("[data-preview]") &&
        (event.key === "Enter" || event.key === " ")
      ) {
        event.preventDefault();
        openPreview(event.target.dataset.preview);
      }
    });

    modalClose.addEventListener("click", closePreview);

    modal.addEventListener("click", event => {
      if (event.target === modal) closePreview();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && modal.classList.contains("open")) {
        closePreview();
      }
    });

    searchInput.addEventListener("input", renderCertificates);
    categoryFilter.addEventListener("change", renderCertificates);

    updateStats();
    renderCertificates();
  </script>
</body>
</html>
