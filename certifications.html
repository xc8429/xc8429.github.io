<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Michael 的資訊站｜AI 課程與資訊技術培訓證書">
  <title>培訓證書｜Michael 的資訊站</title>

  <style>
    :root {
      --bg: #11151c;
      --panel: #1b222d;
      --text: #e5eaf2;
      --muted: #9aa8ba;
      --accent: #67d8f5;
      --border: #303c4c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      line-height: 1.8;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1100px, 92%);
      margin: auto;
    }

    /* 導覽列 */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(17, 21, 28, .96);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .navbar {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      color: var(--accent);
      font-size: 19px;
      font-weight: bold;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: var(--muted);
      font-size: 14px;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--accent);
    }

    /* 標題 */
    .hero {
      padding: 60px 0 42px;
      background:
        radial-gradient(
          ellipse at top right,
          rgba(53, 133, 169, .17),
          transparent 55%
        );
      border-bottom: 1px solid var(--border);
    }

    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      letter-spacing: 3px;
    }

    h1 {
      margin: 8px 0;
      font-size: clamp(30px, 5vw, 42px);
    }

    .hero p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    main {
      padding: 40px 0 70px;
    }

    .category {
      margin-bottom: 44px;
    }

    .category-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .category-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid #31576b;
      background: #1b2a37;
      color: var(--accent);
      border-radius: 10px;
      font-size: 21px;
    }

    .category-heading h2 {
      margin: 0;
      font-size: 22px;
    }

    .category-heading p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    /* 小圖示列表 */
    .certificate-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 18px;
    }

    .certificate-item {
      min-width: 0;
      padding: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: border-color .2s, transform .2s;
    }

    .certificate-item:hover {
      border-color: var(--accent);
      transform: translateY(-3px);
    }

    .certificate-link {
      display: block;
      cursor: pointer;
    }

    .thumbnail {
      width: 100%;
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 6px;
      background: #252f3e;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .placeholder {
      color: var(--accent);
      text-align: center;
      font-size: 34px;
    }

    .placeholder span {
      display: block;
      color: var(--muted);
      font-size: 11px;
    }

    .certificate-name {
      margin-top: 9px;
      color: var(--text);
      font-size: 13px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 24px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 10px;
      font-size: 14px;
    }

    footer {
      padding: 24px 0;
      border-top: 1px solid var(--border);
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 850px) {
      .certificate-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .navbar {
        align-items: flex-start;
        flex-direction: column;
        padding: 14px 0;
      }

      .nav-links {
        gap: 12px;
      }
    }

    @media (max-width: 600px) {
      .certificate-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="container navbar">
      <a class="logo" href="index.html">Michael 的資訊站</a>

      <nav class="nav-links" aria-label="主要導覽">
        <a href="index.html">首頁</a>
        <a href="index.html#about">關於我</a>
        <a href="skill.html">技術能力</a>
        <a href="index.html#portfolio">作品集</a>
        <a href="certifications.html" class="active">證照與培訓</a>
        <a href="contact.html">聯絡方式</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <div class="eyebrow">CERTIFICATES & TRAINING</div>
      <h1>培訓證書</h1>
      <p>持續學習、累積知識，記錄每一次專業成長。</p>
    </div>
  </section>

  <main class="container">

    <!-- AI 課程 -->
    <section class="category">
      <div class="category-heading">
        <div class="category-icon" aria-hidden="true">AI</div>
        <div>
          <h2>AI 課程</h2>
          <p>人工智慧、生成式 AI 與相關培訓</p>
        </div>
      </div>

      <div class="certificate-grid" id="aiGrid"></div>
    </section>

    <!-- 資訊技術 -->
    <section class="category">
      <div class="category-heading">
        <div class="category-icon" aria-hidden="true">⌘</div>
        <div>
          <h2>資訊技術</h2>
          <p>網路、系統管理、資訊安全與技術培訓</p>
        </div>
      </div>

      <div class="certificate-grid" id="itGrid"></div>
    </section>

  </main>

  <footer>
    <div class="container">
      © <span id="year"></span> Michael 的資訊站
      ｜持續學習，精進技術
    </div>
  </footer>

  <script>
    /*
      證書資料設定區

      image 請填入圖片路徑，例如：
      images/certificates/ai-course.jpg

      點擊證書會另開新分頁。
      請將實際證書圖片放進 GitHub 專案。
    */

   const certificates = {
  ai: [
    {
      name: "AI 課程證書",
      image: "xc8429.github.io/images/certificates/40392.jpg"
    }
      ],
    it: []
    };

      it: [
        // 在這裡新增實際的資訊技術培訓證書
        // {
        //   name: "實際資訊技術課程名稱",
        //   image: "images/certificates/it-course.jpg"
        // }
      ]
    };

    document.getElementById("year").textContent =
      new Date().getFullYear();

    function renderCertificates(items, gridId, categoryName) {
      const grid = document.getElementById(gridId);

      if (items.length === 0) {
        grid.innerHTML = `
          <div class="empty">
            目前尚未新增${categoryName}證書
          </div>
        `;
        return;
      }

      grid.innerHTML = items.map((item, index) => {
        const name = escapeHTML(item.name);
        const image = escapeHTML(item.image);

        return `
          <article class="certificate-item">
            <a
              class="certificate-link"
              href="${image}"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="另開視窗檢視${name}"
              title="點擊查看證書"
            >
              <div class="thumbnail">
                <img
                  src="${image}"
                  alt="${name}"
                  loading="lazy"
                  draggable="false"
                >
              </div>

              <div class="certificate-name">${name}</div>
            </a>
          </article>
        `;
      }).join("");

      grid.querySelectorAll("img").forEach(img => {
        img.addEventListener("error", () => {
          const thumbnail = img.parentElement;

          thumbnail.innerHTML = `
            <div class="placeholder">
              ▤
              <span>圖片載入失敗</span>
            </div>
          `;
        }, { once: true });
      });
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    renderCertificates(certificates.ai, "aiGrid", "AI 課程");
    renderCertificates(certificates.it, "itGrid", "資訊技術");

    /*
      注意：
      新分頁直接開啟圖片，瀏覽器仍可能提供另存圖片功能。
      若要限制下載，建議改用獨立的證書檢視 HTML 頁面，
      並搭配伺服器權限控制；GitHub Pages 本身無法真正禁止下載。
    */
  </script>
</body>
</html>
