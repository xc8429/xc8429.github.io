<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Michael 的資訊站｜培訓證書與學習紀錄">
  <title>培訓證書｜Michael 的資訊站</title>

  <style>
    :root {
      --bg: #11151c;
      --panel: #1b222d;
      --panel-hover: #222c39;
      --text: #e5eaf2;
      --muted: #9aa8ba;
      --accent: #67d8f5;
      --border: #303c4c;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.8;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1100px, 92%);
      margin: auto;
    }

    /* 導覽列 */
    header {
      background: rgba(17, 21, 28, 0.96);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(12px);
    }

    .navbar {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 19px;
      font-weight: bold;
      color: var(--accent);
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: var(--muted);
      font-size: 14px;
      transition: color 0.2s;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--accent);
    }

    /* 頁面標題 */
    .hero {
      padding: 70px 0 45px;
      background:
        radial-gradient(
          ellipse at top right,
          rgba(53, 133, 169, 0.17),
          transparent 55%
        );
      border-bottom: 1px solid var(--border);
    }

    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    h1 {
      margin: 10px 0;
      font-size: clamp(30px, 5vw, 44px);
      line-height: 1.4;
    }

    .hero p {
      max-width: 650px;
      color: var(--muted);
      margin-top: 12px;
    }

    /* 培訓統計 */
    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-top: 30px;
      max-width: 650px;
    }

    .stat-card {
      padding: 18px;
      border: 1px solid var(--border);
      background: rgba(27, 34, 45, 0.85);
      border-radius: 12px;
    }

    .stat-number {
      color: var(--accent);
      font-size: 28px;
      font-weight: bold;
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
    }

    /* 主要內容 */
    main {
      padding: 42px 0 70px;
      min-height: 350px;
    }

    .section-heading {
      margin-bottom: 22px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 23px;
    }

    .section-heading p {
      color: var(--muted);
      font-size: 14px;
      margin: 5px 0 0;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      padding: 12px 15px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .certificate-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .certificate-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }

    .certificate-card:hover {
      transform: translateY(-4px);
      border-color: #52758b;
    }

    /* 證書圖片 */
    .certificate-image {
      width: 100%;
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: linear-gradient(135deg, #252f3e, #171e28);
      border-bottom: 1px solid var(--border);
      cursor: zoom-in;
    }

    .certificate-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 10px;
    }

    .placeholder {
      text-align: center;
      padding: 20px;
      color: var(--muted);
    }

    .placeholder .icon {
      display: block;
      color: var(--accent);
      font-size: 40px;
      margin-bottom: 8px;
    }

    .placeholder small {
      display: block;
      margin-top: 5px;
      font-size: 12px;
    }

    .card-content {
      padding: 18px;
    }

    .tag {
      display: inline-block;
      padding: 3px 10px;
      margin-bottom: 10px;
      border: 1px solid #31576b;
      border-radius: 20px;
      color: var(--accent);
      font-size: 11px;
    }

    .card-content h3 {
      margin: 0 0 10px;
      font-size: 18px;
      overflow-wrap: anywhere;
    }

    .card-content p {
      color: var(--muted);
      font-size: 13px;
      margin: 5px 0;
      overflow-wrap: anywhere;
    }

    .description {
      min-height: 48px;
    }

    .btn {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid var(--accent);
      border-radius: 7px;
      background: var(--accent);
      color: #09151c;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      opacity: 0.85;
    }

    .empty-state {
      display: none;
      padding: 45px 20px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 12px;
    }

    /* 證書放大視窗 */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      padding: 24px;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.9);
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      max-width: 1000px;
      max-height: 90vh;
      text-align: center;
    }

    .modal-content img {
      display: block;
      max-width: 100%;
      max-height: 78vh;
      margin: auto;
      object-fit: contain;
    }

    .modal-caption {
      color: white;
      margin-top: 12px;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 22px;
      color: white;
      font-size: 36px;
      background: none;
      border: none;
      cursor: pointer;
    }

    footer {
      padding: 25px 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 850px) {
      .certificate-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .navbar {
        align-items: flex-start;
        flex-direction: column;
        padding: 15px 0;
      }

      .nav-links {
        gap: 12px;
      }
    }

    @media (max-width: 540px) {
      .certificate-grid,
      .stats {
        grid-template-columns: 1fr;
      }

      .hero {
        padding-top: 45px;
      }
    }
  </style>
</head>

<body>
  <!-- 網站導覽列 -->
  <header>
    <div class="container navbar">
      <a class="logo" href="index.html">Michael 的資訊站</a>

      <nav class="nav-links" aria-label="主要導覽">
        <a href="index.html">首頁</a>
        <a href="index.html#about">關於我</a>
        <a href="skill.html">技術能力</a>
        <a href="index.html#portfolio">作品集</a>
        <a href="certifications.html" class="active">證照與培訓</a>
        <a href="contact.html">聯絡方式</a>
      </nav>
    </div>
  </header>

  <!-- 頁面介紹 -->
  <section class="hero">
    <div class="container">
      <div class="eyebrow">TRAINING & LEARNING</div>

      <h1>專業證書</h1>

      <p>
        記錄專業培訓、教育訓練與持續學習成果，
        展現對資訊技術的投入與自我精進。
      </p>

      <div class="stats">
        <div class="stat-card">
          <div class="stat-number" id="trainingCount">0</div>
          <div class="stat-label">培訓證書</div>
        </div>

        <div class="stat-card">
          <div class="stat-number" id="totalCount">0</div>
          <div class="stat-label">學習紀錄</div>
        </div>
      </div>
    </div>
  </section>

  <main class="container">
    <div class="section-heading">
      <h2>我的培訓紀錄</h2>
      <p>點擊證書圖片可放大預覽。</p>
    </div>

    <div class="toolbar">
      <input
        type="search"
        id="searchInput"
        class="search-input"
        placeholder="搜尋課程名稱或培訓單位..."
        aria-label="搜尋培訓紀錄"
      >
    </div>

    <section
      class="certificate-grid"
      id="certificateGrid"
      aria-label="培訓證書列表"
    ></section>

    <div class="empty-state" id="emptyState">
      目前尚未新增培訓證書。
    </div>
  </main>

  <!-- 圖片放大視窗 -->
  <div
    class="modal"
    id="imageModal"
    role="dialog"
    aria-modal="true"
    aria-label="證書圖片預覽"
    aria-hidden="true"
  >
    <button
      class="modal-close"
      id="modalClose"
      type="button"
      aria-label="關閉預覽"
    >&times;</button>

    <div class="modal-content">
      <img id="modalImage" src="" alt="培訓證書">
      <div class="modal-caption" id="modalCaption"></div>
    </div>
  </div>

  <footer>
    <div class="container">
      © <span id="year"></span> Michael 的資訊站
      ｜持續學習，精進技術
    </div>
  </footer>

  <script>
    /*
      培訓證書資料設定區

      請在取得實際證書後新增資料。
      尚未填入真實資料前，網頁會顯示空白提示。

      image 範例：
      images/certificates/ai-training.jpg
    */

    const certificates = [
      // 請在這裡新增你的實際培訓證書，例如：
      //
      // {
      //   id: 1,
      //   name: "實際課程名稱",
      //   issuer: "實際培訓單位",
      //   date: "2026-10",
      //   description: "課程內容與學習成果",
      //   image: "images/certificates/example.jpg"
      // }
    ];

    const grid = document.getElementById("certificateGrid");
    const searchInput = document.getElementById("searchInput");
    const emptyState = document.getElementById("emptyState");

    const modal = document.getElementById("imageModal");
    const modalImage = document.getElementById("modalImage");
    const modalCaption = document.getElementById("modalCaption");
    const modalClose = document.getElementById("modalClose");

    document.getElementById("year").textContent =
      new Date().getFullYear();

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function updateStats() {
      const total = certificates.length;

      document.getElementById("trainingCount").textContent = total;
      document.getElementById("totalCount").textContent = total;
    }

    function renderCertificates() {
      const keyword = searchInput.value.trim().toLowerCase();

      const filtered = certificates.filter(item => {
        const content = [
          item.name,
          item.issuer,
          item.description,
          item.date
        ].join(" ").toLowerCase();

        return content.includes(keyword);
      });

      grid.innerHTML = filtered.map(item => {
        const hasImage = Boolean(item.image && item.image.trim());

        const imageHTML = hasImage
          ? `
            <div
              class="certificate-image"
              data-preview="${Number(item.id)}"
              role="button"
              tabindex="0"
              aria-label="放大查看${escapeHTML(item.name)}"
            >
              <img
                src="${escapeHTML(item.image)}"
                alt="${escapeHTML(item.name)}"
                loading="lazy"
              >
            </div>
          `
          : `
            <div class="certificate-image">
              <div class="placeholder">
                <span class="icon">▤</span>
                尚未提供證書圖片
              </div>
            </div>
          `;

        return `
          <article class="certificate-card">
            ${imageHTML}

            <div class="card-content">
              <span class="tag">培訓證書</span>

              <h3>${escapeHTML(item.name)}</h3>

              <p>培訓單位：${escapeHTML(item.issuer)}</p>
              <p>結訓日期：${escapeHTML(item.date)}</p>

              <p class="description">
                ${escapeHTML(item.description)}
              </p>

              ${
                hasImage
                  ? `<button class="btn"
                       type="button"
                       data-preview="${Number(item.id)}">
                       查看證書
                     </button>`
                  : ""
              }
            </div>
          </article>
        `;
      }).join("");

      emptyState.style.display =
        filtered.length === 0 ? "block" : "none";

      emptyState.textContent = certificates.length === 0
        ? "目前尚未新增培訓證書，請在程式碼中填入實際課程資料。"
        : "找不到符合條件的培訓紀錄。";

      grid.querySelectorAll(".certificate-image img").forEach(img => {
        img.addEventListener("error", () => {
          const parent = img.parentElement;

          parent.removeAttribute("data-preview");
          parent.removeAttribute("role");
          parent.removeAttribute("tabindex");
          parent.style.cursor = "default";

          parent.innerHTML = `
            <div class="placeholder">
              <span class="icon">!</span>
              圖片載入失敗
              <small>請確認圖片路徑與檔名</small>
            </div>
          `;
        }, { once: true });
      });
    }

    function openPreview(id) {
      const item = certificates.find(
        certificate => certificate.id === Number(id)
      );

      if (!item || !item.image) return;

      modalImage.src = item.image;
      modalImage.alt = item.name;
      modalCaption.textContent = item.name;

      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
      modalClose.focus();
    }

    function closePreview() {
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      modalImage.src = "";
    }

    grid.addEventListener("click", event => {
      const target = event.target.closest("[data-preview]");

      if (target) {
        openPreview(target.dataset.preview);
      }
    });

    grid.addEventListener("keydown", event => {
      if (
        event.target.matches("[data-preview]") &&
        (event.key === "Enter" || event.key === " ")
      ) {
        event.preventDefault();
        openPreview(event.target.dataset.preview);
      }
    });

    modalClose.addEventListener("click", closePreview);

    modal.addEventListener("click", event => {
      if (event.target === modal) {
        closePreview();
      }
    });

    document.addEventListener("keydown", event => {
      if (
        event.key === "Escape" &&
        modal.classList.contains("open")
      ) {
        closePreview();
      }
    });

    searchInput.addEventListener("input", renderCertificates);

    updateStats();
    renderCertificates();
  </script>
</body>
</html>
