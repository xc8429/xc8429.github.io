<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>聯絡方式｜Michael的資訊站</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        header {
            background: #1f2937;
            color: white;
            text-align: center;
            padding: 55px 20px;
        }

        header h1 {
            margin: 0 0 12px;
            font-size: 40px;
        }

        header p {
            margin: 0;
            font-size: 18px;
        }

        nav {
            background: white;
            padding: 16px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        nav a {
            color: #333;
            text-decoration: none;
            margin: 0 18px;
            font-weight: bold;
            transition: 0.3s;
        }

        nav a:hover {
            color: #2563eb;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .contact-box {
            background: white;
            padding: 45px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .contact-box h2 {
            font-size: 30px;
            margin-top: 0;
        }

        .contact-box p {
            font-size: 18px;
            line-height: 1.8;
        }

        .email {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 25px;
            background: #1f2937;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            transition: 0.3s;
        }

        .email:hover {
            background: #2563eb;
        }

        .back {
            margin-top: 35px;
        }

        .back a {
            color: #333;
            text-decoration: none;
            font-weight: bold;
        }

        .back a:hover {
            color: #2563eb;
        }

        footer {
            margin-top: 80px;
            background: #1f2937;
            color: white;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 700px) {

            header h1 {
                font-size: 32px;
            }

            nav a {
                display: inline-block;
                margin: 6px 10px;
            }

            .contact-box {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>聯絡方式</h1>
        <p>Michael的資訊站｜歡迎與我聯繫</p>
    </header>

    <nav>
        <a href="index.html">首頁</a>
        <a href="skills.html">技術能力</a>
        <a href="contact.html">聯絡方式</a>
    </nav>

    <main class="container">

        <div class="contact-box">

            <h2>📧 聯絡我</h2>

            <p>
                如果您對我的技術能力、作品或 IT 相關服務有興趣，
                歡迎透過 Email 與我聯絡。
            </p>

            <a class="email"
               href="mailto:你的Email@example.com">
                📧 xc8429@gmail.com
            </a>

            <div class="back">
                <a href="index.html">← 返回首頁</a>
            </div>

        </div>

    </main>

    <footer>
        © 2026 Michael的資訊站
    </footer>

</body>

</html>
