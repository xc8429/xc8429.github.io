<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>網路故障診斷小幫手</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 30px 18px;
      background: #171b24;
      color: #e5eaf3;
      font-family: "Microsoft JhengHei", sans-serif;
    }

    .container {
      max-width: 850px;
      margin: auto;
    }

    header {
      padding: 25px;
      background: #222a38;
      border: 1px solid #35445b;
      border-radius: 14px;
      margin-bottom: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .header-left h1 { color: #67d5ff; margin-top: 0; margin-bottom: 5px; }
    .subtitle { color: #aab8ca; line-height: 1.8; margin: 0; }

    .home-btn {
      background: #2b3b52;
      color: #67d5ff;
      border: 1px solid #52647d;
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s, color 0.2s;
      margin-top: 0;
    }

    .home-btn:hover { background: #35445b; color: #ffffff; }

    .panel {
      background: #222a38;
      border: 1px solid #35445b;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }

    select {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      background: #151b26;
      color: white;
      border: 1px solid #52647d;
      font-size: 16px;
    }

    button.action-btn {
      background: #087ea4;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 11px 16px;
      cursor: pointer;
      margin-top: 12px;
    }

    button.action-btn:hover { background: #069ac5; }

    .step {
      background: #182231;
      padding: 16px;
      border-radius: 9px;
      margin-top: 12px;
      line-height: 1.8;
    }

    code {
      color: #8de2ff;
      overflow-wrap: anywhere;
    }

    .muted { color: #aab8ca; }
    .hidden { display: none; }

    footer {
      text-align: center;
      color: #8593a7;
      padding: 16px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <div class="header-left">
        <h1>網路故障診斷小幫手</h1>
        <p class="subtitle">
          IT 網路維運實用工具<br>
          依照故障現象，逐步檢查可能的網路問題。
        </p>
      </div>
      <div>
        <a href=mywork2.html><button class="home-btn" id="homeBtn">返回小幫手</button></a>
      </div>
      <div>
        <a href=index.html><button class="home-btn" id="homeBtn">返回首頁</button></a>
      </div>
    </header>

    <section class="panel">
      <h2>選擇故障類型</h2>
      <label for="problem">目前遇到什麼問題？</label>
      <select id="problem">
        <option value="" disabled selected>-- 請選擇故障類型 --</option>
        <option value="internet">電腦無法上網</option>
        <option value="dns">DNS 網域解析失敗</option>
        <option value="website">無法連線到特定網站</option>
      </select>
      <button class="action-btn" id="diagnose">顯示排查步驟</button>
    </section>

    <section class="panel hidden" id="result" aria-live="polite">
      <h2 id="resultTitle">排查建議</h2>
      <div id="steps"></div>
    </section>

    <footer>
      個人 IT 作品集｜網路故障診斷小幫手
    </footer>
  </main>

  <script>
    const guides = {
      internet: {
        title: "電腦無法上網",
        steps: [
          {
            name: "檢查 IP 位址",
            detail: "開啟命令提示字元，確認電腦是否取得有效 IP。",
            command: "ipconfig"
          },
          {
            name: "測試預設閘道",
            detail: "先從 ipconfig 找到「預設閘道」，再將下方範例替換成實際 IP。",
            command: "ping 192.168.47.254"
          },
          {
            name: "測試外部網路",
            detail: "測試能否連到外部 IP。部分網路會封鎖 ICMP，因此失敗不一定代表斷網。",
            command: "ping 1.1.1.1"
          }
        ]
      },
      dns: {
        title: "DNS 網域解析失敗",
        steps: [
          {
            name: "查詢 DNS 設定",
            detail: "確認電腦目前使用的 DNS 伺服器。",
            command: "ipconfig /all"
          },
          {
            name: "測試網域解析",
            detail: "查詢網域名稱能否轉換成 IP 位址。",
            command: "nslookup google.com"
          },
          {
            name: "清除本機 DNS 快取",
            detail: "若懷疑快取過期，可清除後再重新測試。",
            command: "ipconfig /flushdns"
          }
        ]
      },
      website: {
        title: "無法連線到特定網站",
        steps: [
          {
            name: "檢查網域解析",
            detail: "確認網站網域是否能解析出 IP。",
            command: "nslookup yahooo.com.tw"
          },
          {
            name: "檢查連線路徑",
            detail: "查看封包經過的網路節點；部分節點可能不回應。",
            command: "tracert google.com"
          },
          {
            name: "測試 HTTPS 服務",
            detail: "確認網站的 443 連接埠是否可連線。",
            command: "curl -I --connect-timeout 5 https://google.com"
          }
        ]
      }
    };

    const problem = document.getElementById("problem");
    const result = document.getElementById("result");
    const resultTitle = document.getElementById("resultTitle");
    const steps = document.getElementById("steps");
    const homeBtn = document.getElementById("homeBtn");

    // 返回首頁按鈕點擊事件：重置下拉選單並隱藏結果區塊
    homeBtn.addEventListener("click", () => {
      problem.selectedIndex = 0;
      result.classList.add("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    document.getElementById("diagnose").addEventListener("click", () => {
      const selectedVal = problem.value;
      if (!selectedVal || !guides[selectedVal]) {
        alert("請先選擇一個故障類型！");
        return;
      }

      const guide = guides[selectedVal];

      resultTitle.textContent = guide.title + "｜排查步驟";
      steps.replaceChildren();

      guide.steps.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "step";

        const heading = document.createElement("h3");
        heading.textContent = (index + 1) + ". " + item.name;

        const detail = document.createElement("p");
        detail.textContent = item.detail;

        const command = document.createElement("code");
        command.textContent = item.command;

        const copy = document.createElement("button");
        copy.className = "action-btn";
        copy.textContent = "複製指令";
        copy.addEventListener("click", async () => {
          try {
            await document.execCommand('copy'); // Fallback or direct copy logic
            // Using standard approach safely:
            const textArea = document.createElement("textarea");
            textArea.value = item.command;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            
            copy.textContent = "已複製";
            setTimeout(() => { copy.textContent = "複製指令"; }, 2000);
          } catch {
            copy.textContent = "複製失敗，請手動選取";
          }
        });

        card.append(heading, detail, command, document.createElement("br"), copy);
        steps.appendChild(card);
      });

      result.classList.remove("hidden");
      result.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  </script>
</body>
</html>
